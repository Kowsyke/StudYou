# Builds the StudYou desktop app (Tauri v2) for macOS, Windows and Linux.
#
# Cross platform installers cannot be built on one machine (a macOS .dmg needs
# a macOS runner, and so on), so this matrix builds each on its native runner.
# Run it manually from the Actions tab, or it fires automatically when a tag
# like desktop-v0.5 is pushed.
#
# Before the desktop app can reach a real backend, set a repository variable
# named VITE_API_URL to the deployed API base, for example
# https://your-api-host/api/v1. It is baked into the bundle at build time.
# When unset, the client falls back to a relative path that only works when the
# app is served from the same origin as the API (the web build), not the
# desktop build.
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-13 # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          # Baked into the built SPA so the desktop app talks to the hosted API.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        with:
          projectPath: apps/client
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: studyou-${{ matrix.platform }}
          path: |
            apps/client/src-tauri/target/**/release/bundle/**/*.dmg
            apps/client/src-tauri/target/**/release/bundle/**/*.app
            apps/client/src-tauri/target/**/release/bundle/**/*.msi
            apps/client/src-tauri/target/**/release/bundle/**/*.exe
            apps/client/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/client/src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: ignore
