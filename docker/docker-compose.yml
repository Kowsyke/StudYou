services:
  postgres:
    image: postgres:17-alpine
    container_name: studyou_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studyou
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studyou"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: studyou_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@studyou.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    container_name: studyou_migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/studyou
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm --filter @studyou/db exec drizzle-kit migrate && pnpm --filter @studyou/db exec bun run src/seed.ts"
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: studyou_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/studyou
      JWT_SECRET: production_secret_key_for_local_compose
      CLIENT_URL: http://localhost:8080
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

